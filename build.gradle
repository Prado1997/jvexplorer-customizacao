plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
}
group = 'br.com.sankhya.dstech'
def skwVersion = "4.36"

// Vamos forçar o java 8 aqui
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

// Garante que os arquivos Kotlin também sejam compilados para Java 1.8
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

// Fontes .java em ISO-8859-1 (padrão Sankhya) — garante leitura correta em qualquer máquina
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'ISO-8859-1'
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://maven.sankhya.com.br/repository/maven-public/")
        allowInsecureProtocol = true
