name: Sync desenv to GitLab

on:
  push:
    branches:
      - desenv

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git config user.email "mirror-bot@ggbridge"
          git config user.name "GGBridge Mirror"

          GITLAB_REMOTE="https://${{ secrets.GITLAB_USER }}:${{ secrets.GITLAB_TOKEN }}@${{ secrets.GITLAB_HOST }}/${{ secrets.GITLAB_PROJECT_PATH }}.git"

          git remote add gitlab "$GITLAB_REMOTE"
          git push gitlab HEAD:desenv --force-with-lease